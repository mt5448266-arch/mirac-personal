<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Miraç'ın kişisel sayfası — Sessiz kal, iz bırak." />
  <title>MİRAÇ | Sessiz kal, iz bırak.</title>
  <style>
    :root { --red: #ff1738; --bg: #080808; --muted: #a7a7a7; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; color: #f7f7f7; background: radial-gradient(ellipse at 50% 0%, #310711 0%, var(--bg) 45%); font-family: Arial, Helvetica, sans-serif; }
    .wrap { width: min(920px, 100% - 32px); margin: 0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; padding: 22px 0; border-bottom: 1px solid #ffffff12; }
    .brand { font-weight: 900; letter-spacing: 3px; color: var(--red); text-shadow: 0 0 18px #ff173866; }
    .nav a { color:#ddd; text-decoration:none; margin-left:18px; font-size:13px; }
    .hero { min-height: 75vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 58px 0 70px; }
    .avatar { width:124px; height:124px; border:2px solid var(--red); border-radius:50%; display:grid; place-items:center; background:linear-gradient(145deg,#26050b,#111); box-shadow:0 0 18px #ff173833, inset 0 0 25px #ff17381a; margin-bottom:28px; overflow:hidden; }
    .avatar span { font-size:44px; font-weight:900; color:var(--red); }
    .avatar img { width:100%; height:100%; object-fit:cover; display:none; }
    h1 { margin:0; font-size:clamp(48px, 12vw, 94px); font-weight:900; letter-spacing:clamp(5px, 2vw, 14px); color:#fff; text-shadow:0 0 10px #ff173855, 0 0 35px #ff173833; }
    .slogan { color:var(--red); letter-spacing:clamp(2px, 1vw, 5px); font-size:clamp(12px, 3vw, 17px); font-weight:800; margin:20px 0 0; }
    .line { width:72px; height:3px; background:var(--red); box-shadow:0 0 15px var(--red); margin:28px auto; }
    .hint { color:var(--muted); max-width:430px; line-height:1.7; font-size:14px; }
    .button { display:inline-block; margin-top:25px; border:1px solid var(--red); color:#fff; background:#ff173814; padding:12px 22px; border-radius:5px; text-decoration:none; font-size:13px; font-weight:700; letter-spacing:1px; transition:.2s; }
    .button:hover { background:var(--red); box-shadow:0 0 24px #ff173855; }
    section { padding:42px 0 70px; }
    .section-title { font-size:22px; margin:0 0 20px; letter-spacing:2px; }
    .section-title span { color:var(--red); }
    .about-card { padding:24px; border:1px solid #ff173833; background:linear-gradient(135deg,#171010cc,#0d0d0dcc); border-radius:10px; line-height:1.8; color:#c9c9c9; }
    .about-card strong { color:#fff; }
    footer { text-align:center; padding:24px 0 32px; color:#777; font-size:12px; border-top:1px solid #ffffff12; }
    footer span { color:var(--red); }
    @media (max-width:500px) { .nav a { margin-left:10px; font-size:12px; } .hero { min-height:68vh; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">M.</div>
      <nav class="nav"><a href="#anasayfa">Ana Sayfa</a><a href="#hakkimda">Hakkımda</a></nav>
    </header>
    <main>
      <section class="hero" id="anasayfa">
        <div class="avatar" aria-label="Profil fotoğrafı alanı">
          <span id="initials">M</span>
          <img id="profilePhoto" alt="Miraç'ın profil fotoğrafı" />
        </div>
        <h1>MİRAÇ</h1>
        <p class="slogan">SESSİZ KAL İZ BIRAK</p>
        <div class="line"></div>
        <p class="hint">Herkes konuşur. Bazıları iz bırakır.</p>
        <a class="button" href="#hakkimda">BENİ TANI</a>
      </section>
      <section id="hakkimda">
        <h2 class="section-title"><span>//</span> HAKKIMDA</h2>
        <div class="about-card">
          <strong>Ben Miraç.</strong><br />
          Kendi yolumda, kendi kurallarımla ilerliyorum. Fazla söze gerek yok — <strong>sessiz kal, iz bırak.</strong>
        </div>
      </section>
    </main>
    <footer>© <span id="year"></span> MİRAÇ · Sessiz kal, iz bırak.</footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // Profil fotoğrafını eklemek için aşağıdaki dosya adını fotoğrafınla değiştir:
    // Örnek: document.getElementById('profilePhoto').src = 'profil.jpg';
    // document.getElementById('profilePhoto').style.display = 'block';
    // document.getElementById('initials').style.display = 'none';
  </script>
</body>
</html>
